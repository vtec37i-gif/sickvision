    /* ===================== */
    const entriesPanel = document.getElementById("entries-panel");

    const SORT_MODES = [

    let currentSortModeIndex = 2;

    function getCurrentSortMode() {

    function updateSortButtonUi() {
      const mode = SORT_MODES[currentSortModeIndex];

      sortButton.setAttribute("aria-label", `Sort entries: ${mode.title}`);
      sortButton.classList.remove("sort-new", "sort-old", "sort-char-count");

    function setupFilterOpenOnlyLabel(selectEl, openLabel) {
      if (!selectEl || !selectEl.options || selectEl.options.length === 0) return;

      const firstOption = selectEl.options[0];

      function syncClosedLabel() {
        if (selectEl.value === "all") {
          firstOption.textContent = "";
        }
      }

      selectEl.addEventListener("focus", () => {
        firstOption.textContent = openLabel;
      });

      selectEl.addEventListener("blur", syncClosedLabel);
      selectEl.addEventListener("change", syncClosedLabel);
      syncClosedLabel();
    }

    // Entries buttons + pages
    const pageLinks = [];
    let visibleEntryOrder = [];

    // Generate dark spectrum colors evenly spread, shuffled randomly
    function getDarkSpectrumColors(count) {
      const colors = Array.from({ length: count }, (_, i) => {
        const h = Math.round((i / count) * 360);
        return `hsl(${h}, 60%, 10%)`;
      });
      // Fisher-Yates shuffle
      for (let i = colors.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [colors[i], colors[j]] = [colors[j], colors[i]];
      }
      return colors;
    }

    const pageBgColors = getDarkSpectrumColors(config.entriesButtons.length);

    const MONTH_SHORT_NAMES = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
    const MONTH_NAME_LOOKUP = {
      january: 0, jan: 0,

    function normalizeEntryKey(value) {
      return String(value || "").trim().toLowerCase();
    }

    config.entriesButtons = config.entriesButtons.map((entry) => {
      const overrideDate = ENTRY_DATE_OVERRIDES[normalizeEntryKey(entry.text)];
      if (!overrideDate) return entry;
      return {
        ...entry,
        date: overrideDate
      };
    });

    function toTitleCase(value) {
      return value
        .split(/\s+/)
        .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
        .join(" ");
    }

    function inferEntryType(entry) {
      const haystack = `${entry.text} ${stripHtml(entry.content || "")}`.toLowerCase();
      if (/(molly|mdma|acid|shroom|psylocybin|psychedelic|drug|substance)/.test(haystack)) {
        return "substance";
      }
      if (/(music|song|playlist|soundcloud|spotify|youtube|artist|rap|beat)/.test(haystack)) {
        return "music";
      }
      if (/(internet|social media|texting|online|algorithm)/.test(haystack)) {
        return "internet";
      }
      return "reflection";
    }

    function parseExplicitDate(value) {
      if (typeof value !== "string" || !value.trim()) return null;
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return null;
      return {
        timestamp: parsed.getTime(),
        year: String(parsed.getFullYear()),
        month: MONTH_SHORT_NAMES[parsed.getMonth()],
        day: parsed.getDate(),
        precision: "day"
      };
    }

    function buildDateLabel(dateInfo) {
      if (dateInfo.precision === "day" && dateInfo.timestamp !== null) {
        const parsed = new Date(dateInfo.timestamp);
        return `${toTitleCase(MONTH_SHORT_NAMES[parsed.getMonth()])} ${parsed.getDate()}, ${parsed.getFullYear()}`;
      }
      if (dateInfo.precision === "month") {
        if (dateInfo.year !== "unspecified" && dateInfo.month !== "unspecified") {
          return `${toTitleCase(dateInfo.month)} ${dateInfo.year}`;
        }
        if (dateInfo.month !== "unspecified") {
          return toTitleCase(dateInfo.month);
        }
      }
      if (dateInfo.precision === "year" && dateInfo.year !== "unspecified") {
        return dateInfo.year;
      }
      return "unspecified";
    }

    function detectDateFromContent(entry) {
      const explicitDate = parseExplicitDate(entry.date);
      if (explicitDate) return explicitDate;

      const haystack = `${entry.text} ${stripHtml(entry.content || "")}`;
      const normalized = haystack.replace(/\s+/g, " ").trim();
      const monthNamesPattern = "january|jan|february|feb|march|mar|april|apr|may|june|jun|july|jul|august|aug|september|sept|sep|october|oct|november|nov|december|dec";

      const isoMatch = normalized.match(/\b(19|20)\d{2}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])\b/);
      if (isoMatch) {
        return parseExplicitDate(isoMatch[0]);
      }

      const numericDateMatch = normalized.match(/\b(0?[1-9]|1[0-2])[\/\-](0?[1-9]|[12]\d|3[01])[\/\-]((?:19|20)\d{2})\b/);
      if (numericDateMatch) {
        const monthIndex = Number(numericDateMatch[1]) - 1;
        const day = Number(numericDateMatch[2]);
        const year = Number(numericDateMatch[3]);
        const parsed = new Date(year, monthIndex, day);
        return {
          timestamp: parsed.getTime(),
          year: String(year),
          month: MONTH_SHORT_NAMES[monthIndex],
          day,
          precision: "day"
        };
      }

      const monthDayYearMatch = normalized.match(new RegExp(`\\b(${monthNamesPattern})\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+)((?:19|20)\\d{2})\\b`, "i"));
      if (monthDayYearMatch) {
        const monthIndex = MONTH_NAME_LOOKUP[monthDayYearMatch[1].toLowerCase()];
        const day = Number(monthDayYearMatch[2]);
        const year = Number(monthDayYearMatch[3]);
        const parsed = new Date(year, monthIndex, day);
        return {
          timestamp: parsed.getTime(),
          year: String(year),
          month: MONTH_SHORT_NAMES[monthIndex],
          day,
          precision: "day"
        };
      }

      const monthYearMatch = normalized.match(new RegExp(`\\b(${monthNamesPattern})\\s+((?:19|20)\\d{2})\\b`, "i"));
      if (monthYearMatch) {
        const monthIndex = MONTH_NAME_LOOKUP[monthYearMatch[1].toLowerCase()];
        const year = Number(monthYearMatch[2]);
        if (year !== null) {
          const parsed = new Date(year, monthIndex, 1);
          return {
            timestamp: parsed.getTime(),
            year: String(year),
            month: MONTH_SHORT_NAMES[monthIndex],
            day: null,
            precision: "month"
          };
        }
      }

      const yearMatch = normalized.match(/\b(19|20)\d{2}\b/);
      if (yearMatch) {
        const year = Number(yearMatch[0]);
        return {
          timestamp: new Date(year, 0, 1).getTime(),
          year: String(year),
          month: "unspecified",
          day: null,
          precision: "year"
        };
      }

      const monthMatch = normalized.match(new RegExp(`\\b(${monthNamesPattern})\\b`, "i"));
      if (monthMatch) {
        const monthIndex = MONTH_NAME_LOOKUP[monthMatch[1].toLowerCase()];
        return {
          timestamp: null,
          year: "unspecified",
          month: MONTH_SHORT_NAMES[monthIndex],
          day: null,
          precision: "month"
        };
      }

      return {
        timestamp: null,
        year: "unspecified",
        month: "unspecified",
        day: null,
        precision: "unspecified"
      };
    }

    const entriesMeta = config.entriesButtons.map((entry, originalIndex) => {
      const plainContent = stripHtml(entry.content || "").replace(/\s+/g, " ").trim();
      const detectedDate = detectDateFromContent(entry);
      return {
        ...entry,
        originalIndex,
        dateTimestamp: detectedDate.timestamp,
        dateLabel: buildDateLabel(detectedDate),
        year: detectedDate.year,
        month: detectedDate.month,
        entryType: (entry.entryType || inferEntryType(entry)).toLowerCase(),
        charCount: plainContent.length,
        lengthBucket: ""
      };
    });

    function buildLengthFilterMetadata(entries) {
      const buckets = [
        { value: "shortest", label: "shortest entries", min: 0, max: 99 },
        { value: "short", label: "short entries", min: 100, max: 499 },
        { value: "long", label: "very long entries", min: 500, max: 1999 },
        { value: "longest", label: "longest entries", min: 2000, max: Number.POSITIVE_INFINITY }
      ];

      entries.forEach((entry) => {
        const matched = buckets.find((bucket) => entry.charCount >= bucket.min && entry.charCount <= bucket.max);
        entry.lengthBucket = matched ? matched.value : "longest";
      });

      const options = [
        { value: "longest", label: "longest entries" },
        { value: "long", label: "long entries" },
        { value: "short", label: "short entries" },
        { value: "shortest", label: "shortest entries" }
      ];

      return { options };
    }

    const lengthFilterMeta = buildLengthFilterMetadata(entriesMeta);

    function appendOption(select, value, label) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      select.appendChild(option);
    }

    function populateFilterOptions() {
      const years = new Set();
      const months = new Set();

      entriesMeta.forEach((entry) => {
        if (entry.year && entry.year !== "unspecified") years.add(entry.year);
        if (entry.month && entry.month !== "unspecified") months.add(entry.month);
      });

      Array.from(years)
        .sort((a, b) => Number(b) - Number(a))
        .forEach((year) => appendOption(yearFilter, year, year));
      appendOption(yearFilter, "unspecified", "unspecified");

      Array.from(months)
        .sort((a, b) => MONTH_SHORT_NAMES.indexOf(a) - MONTH_SHORT_NAMES.indexOf(b))
        .forEach((month) => appendOption(monthFilter, month, toTitleCase(month)));
      appendOption(monthFilter, "unspecified", "unspecified");

      lengthFilterMeta.options.forEach((option) => appendOption(lengthFilter, option.value, option.label));
    }

    populateFilterOptions();
    setupFilterOpenOnlyLabel(yearFilter, "all years");
    setupFilterOpenOnlyLabel(monthFilter, "all months");
    setupFilterOpenOnlyLabel(lengthFilter, "all lengths");

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    entriesMeta.forEach((btn, idx) => {
      const a = document.createElement("a");
      a.textContent = btn.text;
      a.onclick = () => togglePage(idx);

      const pageDiv = document.createElement("div");

      pageDiv.dataset.entryText = btn.text;
      pageDiv.innerHTML = `
        <h3>${btn.text}</h3>

    // keep track of which page (if any) is currently displayed
    let currentPage = null;

    function togglePage(n) {
      // if the user clicked the already-open page, close it
      if (currentPage === n) {
        const activePage = document.getElementById("page" + n);
        activePage.style.display = "none";
        pages.style.backgroundColor = "var(--page-bg)"; // revert to default panel color
        currentPage = null;
        return;
      }

      // otherwise show the requested page
      document.querySelectorAll(".page").forEach(p => p.style.display = "none");
      const activePage = document.getElementById("page" + n);
      activePage.style.display = "block";
      pages.style.backgroundColor = pageBgColors[n];
      currentPage = n;
    }

    function stripHtml(text) {
      return text.replace(/<[^>]*>/g, " ");
    }

    function linkify(html) {
      // Match bare URLs not already inside an href attribute
      return html.replace(/(?<!href=["'])((https?:\/\/|www\.)[^\s<>"']+[^\s<>"'.,!?;:)])/gi, (url) => {
        const href = url.startsWith("http") ? url : "https://" + url;
        return `<a href="${href}" target="_blank" rel="noopener noreferrer">${url}</a>`;
      });
    }

    function entryMatchesSearch(entry, query) {
      if (!query) return true;
      const haystack = `${entry.text} ${stripHtml(entry.content)}`.toLowerCase();
      return haystack.includes(query);
    }

    function sortEntries(entries, sortMode) {
      if (sortMode === "old") {
        return entries.sort((a, b) => {
          if (a.dateTimestamp === null && b.dateTimestamp === null) {
            return a.originalIndex - b.originalIndex;
          }
          if (a.dateTimestamp === null) return 1;
          if (b.dateTimestamp === null) return -1;
          return a.dateTimestamp - b.dateTimestamp;
        });
      }
      if (sortMode === "char-count") {
        return entries.sort((a, b) => {
          if (b.charCount === a.charCount) {
            return b.originalIndex - a.originalIndex;
          }
          return b.charCount - a.charCount;
        });
      }
      // "new": latest dates first
      return entries.sort((a, b) => {
        if (a.dateTimestamp === null && b.dateTimestamp === null) {
          return b.originalIndex - a.originalIndex;
        }
        if (a.dateTimestamp === null) return 1;
        if (b.dateTimestamp === null) return -1;
        return b.dateTimestamp - a.dateTimestamp;
      });
    }

    function applyControls() {
      const query = entrySearch.value.trim().toLowerCase();
      const selectedYear = yearFilter.value;
      const selectedMonth = monthFilter.value;
      const selectedLength = lengthFilter.value;
      const sortMode = getCurrentSortMode();

      const visibleEntries = entriesMeta.filter((entry) => {
        if (!entryMatchesSearch(entry, query)) return false;
        if (selectedYear !== "all" && entry.year !== selectedYear) return false;
        if (selectedMonth !== "all" && entry.month !== selectedMonth) return false;
        if (selectedLength !== "all" && entry.lengthBucket !== selectedLength) return false;
        return true;
      });

      sortEntries(visibleEntries, sortMode);
      visibleEntryOrder = visibleEntries.map((entry) => entry.originalIndex);

      pageLinks.forEach((link, idx) => {
        const orderPos = visibleEntryOrder.indexOf(idx);
        if (orderPos === -1) {
          link.style.display = "none";
          link.style.order = "";
          return;
        }
        link.style.display = "inline-block";
        link.style.order = String(orderPos);
      });

      if (currentPage !== null && !visibleEntryOrder.includes(currentPage)) {
        document.getElementById("page" + currentPage).style.display = "none";
        pages.style.backgroundColor = "var(--page-bg)";
        currentPage = null;
      }
    }

    function applySearchFilter(rawQuery) {
      entrySearch.value = rawQuery;
      applyControls();
    }

    function openFirstVisibleEntry() {
      if (visibleEntryOrder.length > 0) {
        togglePage(visibleEntryOrder[0]);
      }
    }

    entrySearch.addEventListener("input", (event) => {
      applySearchFilter(event.target.value);
    });

    entrySearch.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        openFirstVisibleEntry();
      }
    });

    sortButton.addEventListener("click", () => {
      currentSortModeIndex = (currentSortModeIndex + 1) % SORT_MODES.length;
      updateSortButtonUi();
      applyControls();
    });

    yearFilter.addEventListener("change", applyControls);
    monthFilter.addEventListener("change", applyControls);
    lengthFilter.addEventListener("change", applyControls);

    // Hyperlinks panel links
    config.hyperlinksLinks.forEach((lc, idx) => {
      const a = document.createElement("a");
      a.href = lc.url;
      a.target = "_blank";
      a.style.color = lc.color;
      a.style.animationDelay = `${idx * 0.1}s`;
      if (lc.img) {
        const img = document.createElement("img");
        img.src = lc.img;
        img.alt = lc.text;
        a.appendChild(img);
      } else {
        a.textContent = lc.text;
      }
      hyperlinksPanel.appendChild(a);
    });

    // embed panel removed

    // Static colors evenly spread through colour spectrum
    function assignSpectrumColors() {
      const count = config.entriesButtons.length;
      pageLinks.forEach((link, idx) => {
        const h = Math.round((idx / count) * 360);
        link.style.color = `hsl(${h}, 80%, 55%)`;
      });
    }

    assignSpectrumColors();
    updateSortButtonUi();
    applySearchFilter("");
    // no default page on load; user must click a link to view a page
    // togglePage(0);
  </script>
